<!DOCTYPE html>
<script src="include.js"></script>
<style>
    body {
        margin: 0;
        font: 20px serif;
    }
</style>
<svg width="300" height="80">
    <text id="label" x="10" y="40">10,000 BCE</text>
</svg>
<script>
    test(() => {
        const describe = (x, y) => {
            const position = document.caretPositionFromPoint(x, y);
            if (!position)
                return "(none)";
            const node = position.offsetNode;
            const text = node.nodeType === Node.TEXT_NODE ? JSON.stringify(node.data) : node.nodeName;
            return `${text}@${position.offset}`;
        };
        // <text x="10" y="40"> is a 20px line whose baseline is at y=40, so its characters sit just above it.
        println(`element at the first character: ${document.elementFromPoint(12, 32)?.nodeName ?? "(none)"}`);
        println(`caret at the first character: ${describe(12, 32)}`);
        println(`caret at the last character: ${describe(105, 32)}`);

        internals.mouseDown(11, 32, 1, 0, 0, 1);
        internals.mouseMove(120, 32, 0, 1);
        internals.mouseUp(120, 32, 0, 0, 0);
        println(`dragging across the text element selects "${getSelection().toString()}"`);
    });
</script>
